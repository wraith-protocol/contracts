name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      evm: ${{ steps.filter.outputs.evm }}
      stellar: ${{ steps.filter.outputs.stellar }}
      solana: ${{ steps.filter.outputs.solana }}
      ckb: ${{ steps.filter.outputs.ckb }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            evm:
              - 'evm/**'
            stellar:
              - 'stellar/**'
            solana:
              - 'solana/**'
            ckb:
              - 'ckb/**'

  evm:
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --check --ignore-path ../.prettierignore .
      - run: npx hardhat compile
      - run: npx hardhat test

  stellar:
    needs: changes
    if: needs.changes.outputs.stellar == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  stellar-size-check:
    needs: changes
    if: needs.changes.outputs.stellar == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --release
      - name: Check Wasm sizes
        run: |
          BUDGET=112640 # 110 KB in bytes
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            size=$(stat -c%s "$wasm")
            name=$(basename "$wasm" .wasm)
            echo "Contract $name size: $size bytes (Budget: $BUDGET bytes)"
            if [ "$size" -gt "$BUDGET" ]; then
              echo "Error: Contract $name exceeds Wasm size budget!"
              exit 1
            fi
          done

  solana:
    needs: changes
    if: needs.changes.outputs.solana == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: heyAyushh/setup-anchor@v4.2
        with:
          anchor-version: 0.30.1
      - run: anchor build

  ckb:
    needs: changes
    if: needs.changes.outputs.ckb == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ckb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64imac-unknown-none-elf
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      - run: CC_riscv64imac_unknown_none_elf=riscv64-unknown-elf-gcc cargo build --target riscv64imac-unknown-none-elf --release -p wraith-stealth-lock
