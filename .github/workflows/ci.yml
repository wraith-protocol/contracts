name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly fuzzing run at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      evm: ${{ steps.filter.outputs.evm }}
      stellar: ${{ steps.filter.outputs.stellar }}
      solana: ${{ steps.filter.outputs.solana }}
      ckb: ${{ steps.filter.outputs.ckb }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            evm:
              - 'evm/**'
            stellar:
              - 'stellar/**'
            solana:
              - 'solana/**'
            ckb:
              - 'ckb/**'

  evm:
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --check --ignore-path ../.prettierignore .
      - run: npx hardhat compile
      - run: npx hardhat test

  stellar:
    needs: changes
    if: needs.changes.outputs.stellar == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  solana:
    needs: changes
    if: needs.changes.outputs.solana == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: heyAyushh/setup-anchor@v4.2
        with:
          anchor-version: 0.30.1
      - run: anchor build

  ckb:
    needs: changes
    if: needs.changes.outputs.ckb == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ckb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64imac-unknown-none-elf
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      - run: CC_riscv64imac_unknown_none_elf=riscv64-unknown-elf-gcc cargo build --target riscv64imac-unknown-none-elf --release -p wraith-stealth-lock

  fuzz:
    # Nightly cargo-fuzz run against stealth-sender's batch payload surface.
    # Scheduled/manual only — a 30-minute budget is too heavy for every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar/stealth-sender/fuzz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "^0.12" --locked
      # 30-minute total budget, split evenly across the two targets (900s each).
      - name: Fuzz batch_decode
        run: cargo fuzz run batch_decode -- -max_total_time=900
      - name: Fuzz batch_execute
        run: cargo fuzz run batch_execute -- -max_total_time=900
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: stellar/stealth-sender/fuzz/artifacts/
