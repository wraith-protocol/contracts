name: Stellar Futurenet Smoke Tests

on:
  schedule:
    - cron: "0 3 * * 0"   # Weekly, Sunday 3am UTC
  workflow_dispatch:       # Manual trigger

jobs:
  smoke-test:
    name: Futurenet smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked

      - name: Run deployed-network smoke test
        env:
          STELLAR_ADMIN_SECRET: ${{ secrets.FUTURENET_TEST_SECRET }}
        run: ./stellar/scripts/deploy-dryrun.sh 2>&1 | tee test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: futurenet-test-results
          path: test-results.txt