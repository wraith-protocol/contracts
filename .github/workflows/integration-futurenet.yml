name: Stellar Futurenet Smoke Tests

on:
  schedule:
    - cron: "0 3 * * 0"   # Weekly, Sunday 3am UTC
  workflow_dispatch:       # Manual trigger

# Reviewed toolchain pins. Bump them only through the process in SUPPLY_CHAIN.md.
env:
  RUST_TOOLCHAIN: '1.98.1'
  STELLAR_CLI_VERSION: '28.0.0'

jobs:
  integration:
    name: Futurenet smoke tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install stellar-cli --version "=${STELLAR_CLI_VERSION}" --locked

      - name: Run deployed-network smoke test
        env:
          STELLAR_ADMIN_SECRET: ${{ secrets.FUTURENET_TEST_SECRET }}
        run: |
          set -o pipefail
          ./stellar/scripts/deploy-dryrun.sh 2>&1 | tee test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: futurenet-test-results
          path: test-results.txt