[package]
name = "stealth-batch-sender"
version = "0.1.0"
edition = "2021"
description = "Atomic batch stealth sends for the Wraith Protocol on Stellar"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]
# Rehearsal-only: shortens the 7-day rotation timelock to make an operator
# recovery drill practical to run in one sitting on a real network. Never
# built into a production deployment — see docs/RECOVERY_DRILL.md.
drill-timelock = []

[dependencies]
soroban-sdk = { workspace = true }
wraith-metrics = { path = "../wraith-metrics" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stealth-announcer = { path = "../stealth-announcer" }