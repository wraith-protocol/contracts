[workspace]
members = [
  "stealth-announcer",
  "stealth-registry",
  "stealth-sender",
  "stealth-splitter",
  "stealth-batch-sender",
  "stealth-vault",
  "wraith-names",
  "bench",
  "bench-crossover",
  "wraith-asset-policy",
  "wraith-metrics",
  "contracts/governance",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "22.0.11"


[profile.release]
opt-level = "z"
strip = "debuginfo"
lto = true
codegen-units = 1
panic = "abort"

