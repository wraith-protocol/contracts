[workspace]
members = [
  "stealth-announcer",
  "stealth-registry",
  "stealth-sender",
  "stealth-splitter",
  "stealth-batch-sender",
  "stealth-vault",
  "wraith-names",
  "bench",
  "bench-crossover",
  "wraith-asset-policy",
  "wraith-metrics",
  "integration-tests",
  "contracts/governance",
  "migration-fixtures/stealth-sender-v0",
  "migration-fixtures/wraith-names-v0",
  "migration-fixtures/stealth-registry-v0",
  "upgrade-migration-tests",
]
# A plain `cargo build` from this directory produces the deployable contract
# artifacts, so it must select only the contract crates. `bench`,
# `bench-crossover` and `integration-tests` are host-only: they enable
# soroban-sdk/testutils in [dependencies], and the SDK refuses to compile
# testutils for wasm32, so including them in the default set breaks every wasm
# build (see SUPPLY_CHAIN.md). Reach them with --workspace or -p.
default-members = [
  "stealth-announcer",
  "stealth-registry",
  "stealth-sender",
  "stealth-splitter",
  "stealth-batch-sender",
  "stealth-vault",
  "wraith-names",
  "wraith-asset-policy",
  "wraith-metrics",
  "contracts/governance",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "22.0.11"

# Keep the release profile at the workspace root: Cargo ignores profiles declared
# in member manifests. These settings apply to every contract cdylib, including
# contracts added to the workspace later.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

# Host-side benches (soroban-sdk testutils) cannot use the contract release
# profile: panic="abort" + LTO splits/breaks sdk type identity across crates.
[profile.bench]
inherits = "release"
lto = false
panic = "unwind"
codegen-units = 16
strip = false
debug = true
debug-assertions = true
