<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wraith Protocol — Contract Verification Status</title>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #131820;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --yellow: #eab308;
      --yellow-bg: rgba(234, 179, 8, 0.12);
      --blue: #3b82f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.875rem;
    }

    .overall-status {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      transition: border-color 0.3s;
    }

    .overall-status.pass {
      border-color: var(--green);
    }

    .overall-status.fail,
    .overall-status.error {
      border-color: var(--red);
    }

    .overall-status.pending {
      border-color: var(--yellow);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.125rem;
      font-weight: 600;
      padding: 0.375rem 1rem;
      border-radius: 9999px;
      margin-bottom: 0.5rem;
    }

    .status-badge.pass {
      background: var(--green-bg);
      color: var(--green);
    }

    .status-badge.fail,
    .status-badge.error {
      background: var(--red-bg);
      color: var(--red);
    }

    .status-badge.pending {
      background: var(--yellow-bg);
      color: var(--yellow);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.pass {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .status-dot.fail,
    .status-dot.error {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    .status-dot.pending {
      background: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
    }

    .last-run {
      color: var(--text-dim);
      font-size: 0.8125rem;
      margin-top: 0.5rem;
    }

    .checks {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .check-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .check-card .info {
      flex: 1;
      min-width: 0;
    }

    .check-card .name {
      font-weight: 600;
      font-size: 0.9375rem;
    }

    .check-card .meta {
      color: var(--text-dim);
      font-size: 0.8125rem;
      margin-top: 0.25rem;
    }

    .check-card .meta span {
      margin-right: 0.75rem;
    }

    .check-card .result {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .check-card .result.pass {
      color: var(--green);
    }

    .check-card .result.fail {
      color: var(--red);
    }

    .check-card .result.error {
      color: var(--yellow);
    }

    footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-dim);
    }

    .empty svg {
      margin-bottom: 0.75rem;
      opacity: 0.4;
    }

    .error-detail {
      background: var(--surface);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-top: 1rem;
    }

    .error-detail pre {
      font-size: 0.8125rem;
      color: var(--red);
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Wraith Protocol</h1>
      <p>Reproducible Build Verification Status</p>
    </header>

    <div id="app">
      <div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <p>Loading verification status...</p>
      </div>
    </div>

    <footer>
      <p>
        Built with the <a href="https://github.com/wraith-protocol/contracts">Wraith Protocol Contracts</a> 
        <a href="https://github.com/wraith-protocol/contracts/actions/workflows/stellar-verification.yml">CI Workflow</a>
      </p>
    </footer>
  </div>

  <script>
    (function () {
      var LOADING_TIMEOUT_MS = 15000;
      var app = document.getElementById('app');
      var timedOut = false;

      var timeoutId = setTimeout(function () {
        timedOut = true;
        app.innerHTML =
          '<div class="overall-status error">' +
            '<div class="status-badge error">' +
              '<span class="status-dot error"></span>' +
              'Timed Out' +
            '</div>' +
            '<p style="color: var(--text-dim); font-size: 0.875rem; margin-top: 0.5rem;">' +
              'Could not load verification status within ' + (LOADING_TIMEOUT_MS / 1000) + ' seconds. ' +
              'The weekly CI may not have run yet, or the status file is unreachable.' +
            '</p>' +
          '</div>';
      }, LOADING_TIMEOUT_MS);

      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderStatus(data) {
        var overallStatus = data.status || 'pending';
        var checks = data.checks || [];

        var badgeLabel, dotClass;
        if (overallStatus === 'pass') {
          badgeLabel = 'All checks passing';
          dotClass = 'pass';
        } else if (overallStatus === 'fail' || overallStatus === 'error') {
          badgeLabel = 'Verification failed';
          dotClass = 'fail';
        } else {
          badgeLabel = 'Verification pending';
          dotClass = 'pending';
        }

        var lastRun = data.last_run_timestamp
          ? new Date(data.last_run_timestamp).toLocaleString(undefined, {
              year: 'numeric',
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              timeZoneName: 'short'
            })
          : 'Never';

        var checksHtml = '';
        if (checks.length === 0) {
          checksHtml =
            '<div class="empty">' +
              '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
                '<circle cx="12" cy="12" r="10"/>' +
                '<line x1="12" y1="8" x2="12" y2="12"/>' +
                '<line x1="12" y1="16" x2="12.01" y2="16"/>' +
              '</svg>' +
              '<p>No verification checks recorded yet.</p>' +
              '<p style="font-size: 0.8125rem; margin-top: 0.25rem;">The weekly CI pipeline will populate this after its first run.</p>' +
            '</div>';
        } else {
          checksHtml = '<div class="checks">';
          for (var i = 0; i < checks.length; i++) {
            var check = checks[i];
            var cs = check.status || 'error';
            var emoji = cs === 'pass' ? '\u2705' : cs === 'fail' ? '\u274C' : '\u26A0\uFE0F';
            var timeInfo = check.elapsed_seconds ? ' ' + check.elapsed_seconds + 's' : '';

            checksHtml +=
              '<div class="check-card">' +
                '<div class="info">' +
                  '<div class="name">' + escapeHtml(check.contract || 'Unknown') + '</div>' +
                  '<div class="meta">' +
                    '<span>' + escapeHtml(check.network || '-') + '</span>' +
                    '<span>' + escapeHtml((check.commit || '-').slice(0, 8)) + '</span>' +
                    (check.contract_id ? '<span>' + escapeHtml(check.contract_id.slice(0, 8)) + '</span>' : '') +
                    '<span>' + escapeHtml(new Date(check.timestamp).toLocaleString()) + '</span>' +
                  '</div>' +
                '</div>' +
                '<div class="result ' + cs + '">' + emoji + ' ' + label + timeInfo + '</div>' +
              '</div>';
          }
          checksHtml += '</div>';
        }

        var errorHtml = '';
        if (data.error) {
          errorHtml =
            '<div class="error-detail">' +
              '<strong style="color: var(--red);">Error:</strong>' +
              '<pre>' + escapeHtml(data.error) + '</pre>' +
            '</div>';
        }

        app.innerHTML =
          '<div class="overall-status ' + overallStatus + '">' +
            '<div class="status-badge ' + dotClass + '">' +
              '<span class="status-dot ' + dotClass + '"></span>' +
              badgeLabel +
            '</div>' +
            '<div class="last-run">Last checked: ' + lastRun + '</div>' +
            errorHtml +
          '</div>' +
          checksHtml;
      }

      function loadStatus() {
        var baseUrl = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');

        function fetchStatus(url) {
          return fetch(url).then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          });
        }

        var urls = [
          baseUrl + '/status.json',
          './status.json',
          'https://raw.githubusercontent.com/wraith-protocol/contracts/main/stellar/verification/status.json'
        ];

        function tryFetch(index) {
          if (index >= urls.length) {
            if (!timedOut) {
              clearTimeout(timeoutId);
              app.innerHTML =
                '<div class="overall-status error">' +
                  '<div class="status-badge error">' +
                    '<span class="status-dot error"></span>' +
                    'Unavailable' +
                  '</div>' +
                  '<p style="color: var(--text-dim); font-size: 0.875rem; margin-top: 0.5rem;">' +
                    'Could not load verification status. The weekly CI may not have run yet.' +
                  '</p>' +
                '</div>';
            }
            return;
          }

          fetchStatus(urls[index])
            .then(function (data) {
              clearTimeout(timeoutId);
              if (!timedOut) {
                renderStatus(data);
              }
            })
            .catch(function () {
              tryFetch(index + 1);
            });
        }

        tryFetch(0);
      }

      loadStatus();
    })();
  </script>
</body>
</html>
