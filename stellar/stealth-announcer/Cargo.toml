[package]
name = "stealth-announcer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }
# Vetted curve arithmetic for ed25519 point validation. `default-features =
# false` keeps it `no_std`/allocation-free, as required for the wasm contract;
# only decompression and subgroup membership checks are used.
curve25519-dalek = { version = "4", default-features = false }

[dev-dependencies]
proptest = "1.6.0"
soroban-sdk = { workspace = true, features = ["testutils"] }

